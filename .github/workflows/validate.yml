name: validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make check

  source-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >-
          python3 scripts/superlib.py verify-sources
          --collection recent-five-year-core
          --workers 12
          --timeout 15
          --strict
