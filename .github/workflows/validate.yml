name: validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make check
