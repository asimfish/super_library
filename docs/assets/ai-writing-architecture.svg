<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
<title id="title">Super Library: AI research writing specification and contextual dictionary</title>
<desc id="desc">Offline papers are reviewed into one canonical library and built into bounded views. At runtime author facts enter selective retrieval, a bounded bundle, original composition and output review. Primary sources are reopened for scientific verification. Lint and blind effectiveness evaluation have different authority. Six dictionary profiles are a seed, not complete coverage.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#58677b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#223045}.heading{font-size:32px;font-weight:700}.section{font-size:23px;font-weight:700}.node{font-size:23px;font-weight:700}.small{font-size:17px}.tiny{font-size:15px}.body{font-size:20px}.mono{font-family:monospace;font-size:17px}</style>
<rect width="1800" height="1120" fill="#ffffff"/>
<text x="50" y="58" class="heading">Super Library / AI research writing</text>
<text x="50" y="95" class="body">Writing specification + contextual dictionary + section protocols + inspectable evidence boundaries</text>
<text x="50" y="132" class="small">Engineering snapshot: 2026-10-12 · independent STE-inspired design · not STE compliance or an effectiveness certificate</text>
<text x="50" y="179" class="section">A / Offline curation and build</text>
<g data-path="library/sources.jsonl"><rect x="50" y="205" width="285" height="140" fill="#f5f7fa" stroke="#8492a6"/><text x="68" y="241" class="node">Primary papers</text><text x="68" y="280" class="small">sources.jsonl + verified papers</text><text x="68" y="311" class="tiny">Evidence stays outside language context</text></g>
<g data-path="library/promotion_decisions.jsonl"><rect x="385" y="205" width="285" height="140" fill="#f5f7fa" stroke="#8492a6"/><text x="403" y="241" class="node">Maintainer curation</text><text x="403" y="280" class="small">studies + promotion decisions</text><text x="403" y="311" class="tiny">Read, synthesize, deduplicate, review</text></g>
<g data-path="library/writing_spec.json"><rect x="720" y="205" width="285" height="140" fill="#f5f7fa" stroke="#8492a6"/><text x="738" y="241" class="node">Canonical library</text><text x="738" y="280" class="small">rules / entries / section guides</text><text x="738" y="311" class="tiny">One owner per concept or protocol</text></g>
<g data-path="scripts/superlib.py"><rect x="1055" y="205" width="285" height="140" fill="#f5f7fa" stroke="#8492a6"/><text x="1073" y="241" class="node">Deterministic build</text><text x="1073" y="280" class="small">schemas + generated manifests</text><text x="1073" y="311" class="tiny">Validate, render, measure, mirror</text></g>
<g data-path="dist/agent-index.md"><rect x="1390" y="205" width="285" height="140" fill="#f5f7fa" stroke="#8492a6"/><text x="1408" y="241" class="node">Agent views</text><text x="1408" y="280" class="small">dist + portable skill</text><text x="1408" y="311" class="tiny">Small indexes, one route, selected cards</text></g>
<path d="M 335 275 L 385 275" fill="none" stroke="#58677b" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 670 275 L 720 275" fill="none" stroke="#58677b" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 1005 275 L 1055 275" fill="none" stroke="#58677b" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 1340 275 L 1390 275" fill="none" stroke="#58677b" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="50" y="414" class="section">B / Runtime writing path</text>
<g data-path="AGENTS.md"><rect x="50" y="470" width="285" height="140" fill="#f5f7fa" stroke="#8492a6"/><text x="68" y="506" class="node">Author task + facts</text><text x="68" y="545" class="small">domain / section / intent / evidence</text><text x="68" y="576" class="tiny">Required quantities and known limits</text></g>
<g data-path="scripts/superlib.py"><rect x="385" y="470" width="285" height="140" fill="#f5f7fa" stroke="#8492a6"/><text x="403" y="506" class="node">Select context</text><text x="403" y="545" class="small">route or two-pass retrieval</text><text x="403" y="576" class="tiny">One protocol; rhetoric + technical terms</text></g>
<g data-path="scripts/writing_spec.py"><rect x="720" y="470" width="285" height="140" fill="#f5f7fa" stroke="#8492a6"/><text x="738" y="506" class="node">Bounded bundle</text><text x="738" y="545" class="small">compact rules + selected records</text><text x="738" y="576" class="tiny">Full serialized output &lt;= max-chars</text></g>
<g data-path="skills/super-library/SKILL.md"><rect x="1055" y="470" width="285" height="140" fill="#f5f7fa" stroke="#8492a6"/><text x="1073" y="506" class="node">Agent composition</text><text x="1073" y="545" class="small">original prose from supplied facts</text><text x="1073" y="576" class="tiny">Examples are conditional, not evidence</text></g>
<g data-path="scripts/superlib.py"><rect x="1390" y="470" width="285" height="140" fill="#f5f7fa" stroke="#8492a6"/><text x="1408" y="506" class="node">Output review</text><text x="1408" y="545" class="small">limited lint + semantic review</text><text x="1408" y="576" class="tiny">Claims, numbers, citations, scope</text></g>
<path d="M 335 540 L 385 540" fill="none" stroke="#58677b" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 670 540 L 720 540" fill="none" stroke="#58677b" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 1005 540 L 1055 540" fill="none" stroke="#58677b" stroke-width="2"  marker-end="url(#arrow)"/>
