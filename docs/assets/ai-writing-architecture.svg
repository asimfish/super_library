<text x="1100" y="428" class="tiny">one route OR one local bundle, never both</text>
<path d="M192 345 V384 H1640 V470" fill="none" stroke="#315f94" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="790" y="378" class="tiny">Primary-source verification, only when a scientific claim requires it</text>
<text x="50" y="658" class="section">C / Canonical ownership: no second dictionary, no mandatory new reading tier</text>
<rect x="50" y="686" width="520" height="238" fill="#f5f7fa" stroke="#8492a6"/>
<text x="70" y="723" class="node">Writing specification</text>
<text x="70" y="758" class="mono">library/writing_spec.json</text>
<text x="70" y="795" class="body">12 rules; must / prefer; manual check scope</text>
<text x="70" y="831" class="body">6 core rules + relevant section rules</text>
<text x="70" y="867" class="body">Default: summaries only, no example packet</text>
<text x="70" y="903" class="small">No sentence ceiling, tense ban or global whitelist</text>
<rect x="610" y="686" width="560" height="238" fill="#ffffff" stroke="#8492a6"/>
<text x="630" y="723" class="node">Contextual dictionary</text>
<text x="630" y="758" class="mono">library/entries/*.jsonl</text>
<text x="630" y="795" class="body">276 entries; 6 enriched profiles in this seed</text>
<text x="630" y="831" class="body">Sense / part of speech / collocations / scope</text>
<text x="630" y="867" class="body">Same facts: misuse / preferred / reason</text>
<text x="630" y="903" class="small">Success rate is not automatically accuracy or return</text>
<rect x="1210" y="686" width="465" height="238" fill="#f5f7fa" stroke="#8492a6"/>
<text x="1230" y="723" class="node">Section protocols</text>
<text x="1230" y="758" class="mono">library/writing_guides.json</text>
<text x="1230" y="795" class="body">17 protocols; one selected per task</text>
<text x="1230" y="831" class="body">Paragraph role, tables, evidence allocation</text>
<text x="1230" y="867" class="body">19 generated one-file task routes</text>
<text x="1230" y="903" class="small">Unsupported moves are omitted, never filled</text>
<text x="50" y="976" class="section">D / Three distinct checks</text>
<text x="50" y="1017" class="body">Build / CI: artifact and budget contracts   |   Output review: semantic correctness   |   Paired blind evaluation: writing benefit</text>
<text x="50" y="1056" class="small">Evaluation findings return to maintainer review as reviewed changes, not automatic learning. No fresh efficacy result is claimed.</text>
<text x="50" y="1091" class="tiny">Solid arrows: implemented data/control path. Dashed arrow: required external evidence step, not an automated correctness guarantee.</text>
</svg>
